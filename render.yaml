# Blueprint для НОВОГО розгортання сайту (наприклад, в акаунті Render замовника).
# Уже працюючий сервіс «omdaya» створено вручну — цей файл до нього підключати не потрібно.
# Опис кроків — у документі про передачу проєкту.
services:
  - type: web
    name: omdaya
    runtime: node
    plan: starter          # диск (для збереження бази) потребує платного плану
    region: frankfurt      # після створення змінити регіон не можна
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD_HASH
        sync: false          # Render запитає значення під час створення
      - key: SESSION_SECRET
        generateValue: true  # Render згенерує випадковий секрет
      - key: DB_PATH
        value: /var/data/data.sqlite
    disk:
      name: data
      mountPath: /var/data   # усе, що поза цією папкою, зникає при кожному деплої
      sizeGB: 1
